[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "septic"
version = "0.1.0"
description = "Decision support for DNREC reviewers evaluating septic permit applications"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
septic = "septic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
septic = ["rules/*.yaml"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
